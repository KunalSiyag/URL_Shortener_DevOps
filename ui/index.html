<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #0f0f23 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 48px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        h1 {
            color: #fff;
            font-size: 28px;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 36px;
            font-size: 15px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        input[type="url"] {
            width: 100%;
            padding: 18px 24px;
            font-size: 16px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        input[type="url"]:focus {
            outline: none;
            border-color: #6366f1;
            background: rgba(99, 102, 241, 0.1);
        }

        input[type="url"]::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        button {
            width: 100%;
            padding: 18px 24px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: #fff;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px -10px rgba(99, 102, 241, 0.5);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin-top: 24px;
            padding: 20px;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 16px;
            display: none;
        }

        .result.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        .result.error {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
        }

        .result-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(34, 197, 94, 0.8);
            margin-bottom: 8px;
        }

        .result.error .result-label {
            color: rgba(239, 68, 68, 0.8);
        }

        .result-url {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .result-url a {
            flex: 1;
            color: #22c55e;
            text-decoration: none;
            font-weight: 500;
            word-break: break-all;
            font-size: 15px;
        }

        .result.error .result-url span {
            color: #ef4444;
        }

        .copy-btn {
            width: auto;
            padding: 10px 16px;
            font-size: 14px;
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid rgba(34, 197, 94, 0.3);
            flex-shrink: 0;
        }

        .copy-btn:hover {
            background: rgba(34, 197, 94, 0.3);
            box-shadow: none;
        }

        .copy-btn.copied {
            background: #22c55e;
        }

        .history {
            margin-top: 32px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 24px;
        }

        .history-title {
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 200px;
            overflow-y: auto;
        }

        .history-item {
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .history-original {
            flex: 1;
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-short {
            color: #6366f1;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
        }

        .history-short:hover {
            text-decoration: underline;
        }

        .empty-state {
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            padding: 20px;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">
                <div class="logo-icon">🔗</div>
                <h1>URL Shortener</h1>
            </div>
            <p class="subtitle">Transform long URLs into short, shareable links</p>

            <form id="shortenForm">
                <div class="input-group">
                    <input 
                        type="url" 
                        id="urlInput" 
                        placeholder="Paste your long URL here..." 
                        required
                        autocomplete="off"
                    >
                </div>
                <button type="submit" id="submitBtn">
                    Shorten URL
                </button>
            </form>

            <div class="result" id="result">
                <div class="result-label">Your shortened URL</div>
                <div class="result-url">
                    <a href="#" id="shortUrl" target="_blank"></a>
                    <button type="button" class="copy-btn" id="copyBtn">Copy</button>
                </div>
            </div>

            <div class="history" id="history">
                <div class="history-title">Recent URLs</div>
                <div class="history-list" id="historyList">
                    <div class="empty-state">No URLs shortened yet</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080';
        const form = document.getElementById('shortenForm');
        const urlInput = document.getElementById('urlInput');
        const submitBtn = document.getElementById('submitBtn');
        const result = document.getElementById('result');
        const shortUrl = document.getElementById('shortUrl');
        const copyBtn = document.getElementById('copyBtn');
        const historyList = document.getElementById('historyList');

        // Load history from localStorage
        let history = JSON.parse(localStorage.getItem('urlHistory') || '[]');
        renderHistory();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const url = urlInput.value.trim();
            if (!url) return;

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span> Shortening...';
            result.classList.remove('show', 'error');

            try {
                const response = await fetch(`${API_URL}/shorten`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ url }),
                });

                if (!response.ok) {
                    throw new Error('Failed to shorten URL');
                }

                const data = await response.json();
                const shortened = data.ShortURL || data.short_url;

                shortUrl.href = shortened;
                shortUrl.textContent = shortened;
                result.classList.remove('error');
                result.classList.add('show');

                // Add to history
                history.unshift({ original: url, short: shortened });
                if (history.length > 10) history.pop();
                localStorage.setItem('urlHistory', JSON.stringify(history));
                renderHistory();

                urlInput.value = '';
            } catch (error) {
                result.innerHTML = `
                    <div class="result-label">Error</div>
                    <div class="result-url">
                        <span>${error.message}. Is the server running on ${API_URL}?</span>
                    </div>
                `;
                result.classList.add('show', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Shorten URL';
            }
        });

        copyBtn.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(shortUrl.href);
                copyBtn.textContent = 'Copied!';
                copyBtn.classList.add('copied');
                setTimeout(() => {
                    copyBtn.textContent = 'Copy';
                    copyBtn.classList.remove('copied');
                }, 2000);
            } catch (err) {
                console.error('Failed to copy:', err);
            }
        });

        function renderHistory() {
            if (history.length === 0) {
                historyList.innerHTML = '<div class="empty-state">No URLs shortened yet</div>';
                return;
            }

            historyList.innerHTML = history.map(item => `
                <div class="history-item">
                    <span class="history-original" title="${item.original}">${item.original}</span>
                    <a href="${item.short}" class="history-short" target="_blank">${item.short.split('/').pop()}</a>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
